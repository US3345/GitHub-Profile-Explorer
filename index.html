<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GitHub Profile Explorer</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:#0d1117;
      color:white;
      min-height:100vh;
    }

    .container{
      width:90%;
      max-width:1100px;
      margin:40px auto;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .search-section{
      display:flex;
      gap:15px;
      margin-bottom:30px;
    }

    input{
      flex:1;
      padding:14px;
      border:none;
      border-radius:10px;
      outline:none;
    }

    button{
      padding:12px 20px;
      border:none;
      border-radius:10px;
      background:#238636;
      color:white;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#2ea043;
      transform:translateY(-2px);
    }

    .hidden{
      display:none;
    }

    #loading{
      text-align:center;
      margin:20px 0;
    }

    .spinner{
      width:60px;
      height:60px;
      border:6px solid #30363d;
      border-top:6px solid #58a6ff;
      border-radius:50%;
      margin:auto;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    .profile-card{
      background:#161b22;
      padding:25px;
      border-radius:20px;
      display:flex;
      gap:30px;
      align-items:center;
      margin-top:20px;
    }

    .profile-card img{
      width:180px;
      border-radius:50%;
    }

    .profile-info p{
      margin:8px 0;
    }

    .profile-buttons{
      margin-top:20px;
      display:flex;
      gap:15px;
      flex-wrap:wrap;
    }

    #repoContainer{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-top:20px;
    }

    .repo-card{
      background:#161b22;
      padding:20px;
      border-radius:15px;
    }

    .repo-card p{
      margin:10px 0;
    }

    .repo-card a{
      color:#58a6ff;
      text-decoration:none;
    }

    .light-mode{
      background:#f5f5f5;
      color:black;
    }

    .light-mode .profile-card,
    .light-mode .repo-card{
      background:white;
      color:black;
    }

    #errorMessage{
      color:red;
      margin-top:15px;
    }

    @media(max-width:768px){

      .search-section{
        flex-direction:column;
      }

      .profile-card{
        flex-direction:column;
        text-align:center;
      }

    }

  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>GitHub Profile Explorer</h1>

    <button id="themeToggle">
      Toggle Theme
    </button>
  </header>

  <div class="search-section">

    <input
      type="text"
      id="usernameInput"
      placeholder="Enter GitHub username..."
    >

    <button id="searchBtn">
      Search
    </button>

  </div>

  <!-- LOADING -->
  <div id="loading" class="hidden">

    <div class="spinner"></div>

    <p>Loading...</p>

  </div>

  <!-- ERROR -->
  <div id="errorMessage"></div>

  <!-- USER -->
  <div id="profileContainer"></div>

  <!-- REPOSITORIES -->
  <div id="repoSection" class="hidden">

    <h2 style="margin-top:30px;">
      Repositories
    </h2>

    <div id="repoContainer"></div>

  </div>

</div>

<script>

const searchBtn =
document.getElementById("searchBtn");

const usernameInput =
document.getElementById("usernameInput");

const profileContainer =
document.getElementById("profileContainer");

const repoContainer =
document.getElementById("repoContainer");

const loading =
document.getElementById("loading");

const errorMessage =
document.getElementById("errorMessage");

const repoSection =
document.getElementById("repoSection");

const themeToggle =
document.getElementById("themeToggle");

/*
=====================================
SEARCH BUTTON
=====================================
*/

searchBtn.addEventListener("click",()=>{

  const username =
  usernameInput.value.trim();

  if(username===""){
    alert("Please enter username");
    return;
  }

  fetchGitHubUser(username);

});

/*
=====================================
ENTER KEY SUPPORT
=====================================
*/

usernameInput.addEventListener("keypress",(event)=>{

  if(event.key==="Enter"){
    searchBtn.click();
  }

});

/*
=====================================
THEME TOGGLE
=====================================
*/

themeToggle.addEventListener("click",()=>{

  document.body.classList.toggle("light-mode");

});

/*
=====================================
FETCH USER
=====================================
*/

function fetchGitHubUser(username){

  loading.classList.remove("hidden");

  profileContainer.innerHTML="";

  repoContainer.innerHTML="";

  repoSection.classList.add("hidden");

  errorMessage.textContent="";

  /*
    Create XMLHttpRequest object
  */

  const xhr = new XMLHttpRequest();

  /*
    Prepare request
  */

  xhr.open(
    "GET",
    `https://api.github.com/users/${username}`,
    true
  );

  /*
    Runs whenever readyState changes
  */

  xhr.onreadystatechange = function(){

    /*
      readyState 4 means:
      request completed
    */

    if(xhr.readyState===4){

      loading.classList.add("hidden");

      /*
        status 200 = success
      */

      if(xhr.status===200){

        /*
          Convert JSON string
          into JavaScript object
        */

        const userData =
        JSON.parse(xhr.responseText);

        displayUser(userData);

        fetchRepositories(username);

      }

      else if(xhr.status===404){

        errorMessage.textContent =
        "User Not Found";

      }

      else{

        errorMessage.textContent =
        "Something went wrong";

      }

    }

  };

  /*
    Network error handling
  */

  xhr.onerror = function(){

    loading.classList.add("hidden");

    errorMessage.textContent =
    "Network Error";

  };

  /*
    Send request
  */

  xhr.send();

}

/*
=====================================
DISPLAY USER
=====================================
*/

function displayUser(user){

  profileContainer.innerHTML = `

    <div class="profile-card">

      <img
        src="${user.avatar_url}"
        alt="profile"
      >

      <div class="profile-info">

        <h2>${user.login}</h2>

        <p>
          ${user.bio || "No Bio Available"}
        </p>

        <p>
          <strong>Followers:</strong>
          ${user.followers}
        </p>

        <p>
          <strong>Following:</strong>
          ${user.following}
        </p>

        <p>
          <strong>Repositories:</strong>
          ${user.public_repos}
        </p>

        <p>
          <strong>Location:</strong>
          ${user.location || "Not Available"}
        </p>

        <div class="profile-buttons">

          <a
            href="${user.html_url}"
            target="_blank"
          >
            <button>
              Visit Profile
            </button>
          </a>

          <button id="showRepoBtn">
            Show Repositories
          </button>

        </div>

      </div>

    </div>

  `;

  /*
    Show repositories button
  */

  const showRepoBtn =
  document.getElementById("showRepoBtn");

  showRepoBtn.addEventListener("click",()=>{

    repoSection.classList.remove("hidden");

  });

}

/*
=====================================
FETCH REPOSITORIES
=====================================
*/

function fetchRepositories(username){

  const xhr = new XMLHttpRequest();

  xhr.open(
    "GET",
    `https://api.github.com/users/${username}/repos`,
    true
  );

  xhr.onreadystatechange = function(){

    if(xhr.readyState===4){

      if(xhr.status===200){

        const repositories =
        JSON.parse(xhr.responseText);

        displayRepositories(repositories);

      }

      else{

        repoContainer.innerHTML =
        "<p>Unable to load repositories</p>";

      }

    }

  };

  xhr.send();

}

/*
=====================================
DISPLAY REPOSITORIES
=====================================
*/

function displayRepositories(repositories){

  repoContainer.innerHTML="";

  repositories.forEach((repo)=>{

    repoContainer.innerHTML += `

      <div class="repo-card">

        <h3>${repo.name}</h3>

        <p>
          <strong>Language:</strong>
          ${repo.language || "Not Available"}
        </p>

        <p>
          <strong>Stars:</strong>
          ${repo.stargazers_count}
        </p>

        <a
          href="${repo.html_url}"
          target="_blank"
        >
          View Repository
        </a>

      </div>

    `;

  });

}

</script>

</body>
</html>
